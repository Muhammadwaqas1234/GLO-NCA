# =============================================================================
# GLO-NCA V3 -- LOCAL SMOKE config (software validation ONLY, tiny + synthetic).
# NOT a scientific config. Small resolutions/channels/epochs so the full V3 path
# (build -> forward -> backward -> optim -> EMA -> checkpoint -> resume -> eval)
# runs fast on a laptop CPU/GPU. Methodology (loss/EMA/thresholds) matches V3.
# =============================================================================

experiment:
  name: GLO-NCA-V3-local-smoke
  seed: 42

dataset:
  root: null
  number_of_patients: 8
  modalities: [t1n, t1c, t2w, t2f]
  split_seed: 42

# Synthetic smoke: no canonical split. This MUST be declared explicitly --
# the runner refuses a V3 run without data.split_file unless allow_seeded_split
# is set, so a real-data config can never silently invent its own split.
data:
  allow_seeded_split: true

model:
  version: v3
  name: GLO-NCA-V3-MultiLevel-smoke
  level1: {enabled: true, resolution: 16, channels: 16, nca_steps: 4, kernel_size: 3}
  level2: {enabled: true, resolution: 24, channels: 16, nca_steps: 4, kernel_size: 3}
  level3: {enabled: true, resolution: 32, channels: 12, nca_steps: 3, kernel_size: 3}
  feature_fusion: {enabled: true, type: concat}
  fire_rate: 0.6
  use_attention: true
  use_spatial: true
  hidden: 64
  dropout: 0.1

training:
  epochs: 2
  batch_size: 1
  patch_size: 32
  augmentation: none
  workers: 0

optimizer:
  learning_rate: 0.0016
  minimum_learning_rate: 0.00001
  weight_decay: 0.0001

loss:
  tversky_beta: 0.75
  focal_gamma: 1.33

ema:
  enabled: true
  decay: 0.999

gradient:
  clipping_enabled: true
  max_norm: 1.0

evaluation:
  threshold: 0.5
  tune_thresholds: true
  smoothing_window: 1

logging:
  tensorboard: true
  checkpoint_frequency: 1

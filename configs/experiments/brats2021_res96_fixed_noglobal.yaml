# Ablation "without global context": the same three-level cascade as GLO-NCA (24^3 -> 48^3 -> 96^3,
# kernels 7/7/3) with every context mechanism removed -- no SE block, no spatial gate and no
# global-context block. Only the context mechanisms differ from brats2021_res96_glonca.yaml.
base: brats2021_res96_fixed.yaml

experiment:
  name: GLO-NCA-CASCADE-BRATS2021-RES96-FIXED-NOGLOBAL

model:
  levels: 3                       # 24^3 -> 48^3 -> 96^3; coarse levels kernel 7, fine level kernel 3
  steps: [20, 20, 20]             # NCA steps per level, coarse to fine
  use_se: false                   # no squeeze-and-excitation block
  use_spatial: false              # no spatial gate
  use_global: false               # no global-context block

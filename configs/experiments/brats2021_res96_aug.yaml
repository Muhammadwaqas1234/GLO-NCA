# 96^3 with training augmentation (flips, in-plane rotations, intensity jitter); baseline learning rate.
base: brats2021_res96.yaml

experiment:
  name: GLO-NCA-CASCADE-BRATS2021-RES96-AUG

data:
  augment: true
  cache: disk                     # preprocessed volumes on disk (<output>/.cache): low RAM at 96^3

evaluation:
  val_workers: 4                  # parallel loading for the validation pass

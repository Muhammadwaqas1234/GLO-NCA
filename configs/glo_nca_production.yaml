# =============================================================================
# GLO-NCA production configuration (the only training configuration).
#
# Two-level GLO-NCA: 128^3 working volume -> L1 48^3 (global context, whole
# volume) and L2 64^3 (segmentation); 24 channels, 15 + 15 NCA steps, kernel 5;
# SE + spatial global context (k=7) at every step; learned fusion
# Conv3d(48 -> 24); deep supervision. Parameters, measured from the built model:
# 30,209 inference, 30,284 training (75 auxiliary).
#
# Provenance: replaces an earlier 40-step configuration (L1 k7, L2 k3, 33,089
# parameters) by explicit decision; no Dice/IoU/HD95 evidence yet.
#
# Patchify is off: it would shrink the global-context view during training for
# no measured speed gain. The runner refuses a production run with it enabled.
# =============================================================================

experiment:
  name: GLO-NCA-PRODUCTION
  seed: 42

dataset:
  root: null                        # supplied via $DATA_ROOT (set by the cloud entrypoint)
  number_of_patients: 0             # 0 = use the full canonical split
  modalities: [t1n, t1c, t2w, t2f]
  split_seed: 42

data:
  # CANONICAL SPLIT - frozen, never modified. 898 / 200 / 198.
  # SHA d30d71956ee9267017010e5ad71fc033158da818f4af53569e8a65289209559d
  split_file: split/master_split.json
  quality_policy_file: split/data_quality_policy.json

  # Deterministic preprocessing cache (load -> crop -> resample -> labels);
  # augmentation and RNG still run every epoch. About 40 MB per case at 128^3
  # (~36 GB for 898 training cases).
  cache:
    enabled: true                   # ENABLED: 29.7x faster preprocessing per case
    directory: .cache/preprocessed

  # Patchify stays off (see header).
  training_patch:
    enabled: false                  # patchify OFF; the runner refuses true here
    working_volume: 128             # resample target when enabled
    patch_size: 64                  # MUST be strictly < working_volume

model:
  version: v3
  name: GLO-NCA-PRODUCTION

  # ROI is an internal efficiency option; 1.0 = no cropping. Evaluation is
  # always full-volume.
  global_context:
    roi_fraction: 1.0
    global_levels: 1

  level1:                           # GLOBAL-CONTEXT level
    enabled: true
    resolution: 48
    channels: 24
    nca_steps: 15
    kernel_size: 5
  level2:                           # HIGH-RESOLUTION segmentation level
    enabled: true
    resolution: 64
    channels: 24
    nca_steps: 15
    kernel_size: 5
  level3:
    enabled: false                  # structurally NOT instantiated
    resolution: 128
    channels: 16
    nca_steps: 10

  feature_fusion:
    enabled: true
    type: concat                    # concat -> LEARNED Conv3d(48->24), not naive

  fire_rate: 0.6
  use_attention: true               # SE channel global context
  use_spatial: true                 # spatial global context
  # Spatial global-context kernel, stated explicitly (production 7; restored
  # from 5 by explicit decision). Applied at all 30 NCA steps; measure its GPU
  # cost on the first production epoch.
  spatial_kernel_size: 7
  hidden: 128
  dropout: 0.1

  # Deep supervision: one 1x1 aux head per non-final level, training only.
  # Inference 30,209 parameters; training 30,284 (75 auxiliary).
  deep_supervision:
    enabled: true
    weight: 0.4

training:
  # Maximum budget; early stopping below may end the run sooner.
  epochs: 300
  batch_size: 1                     # 2 and 4 verified working; 1 is the default

  # 128^3 working volume: each case is resampled to it and passed whole; the
  # model resizes internally to L1 48^3 and L2 64^3.
  patch_size: 128
  augmentation: light
  workers: 2

  # --- early stopping ------------------------------------------------------
  # Validation only (test is never used): 3-epoch rolling mean of validation
  # mean Dice over WT/TC/ET, the same metric as best-checkpoint selection.
  # Stopping never overwrites best.pth; evaluation loads the best weights.
  early_stopping:
    enabled: true
    monitor: validation mean foreground Dice
    mode: max                       # higher Dice is better
    patience: 15                    # consecutive non-improving validations
    # 0.01 is about one standard error of validation mean Dice (200 cases), so
    # noise alone does not reset patience.
    min_delta: 0.01

optimizer:
  # Warmup: 3 epochs linear to peak LR 0.0016, then cosine to 1e-5 over the
  # remaining steps (total step count unchanged). For stability; no Dice claim.
  warmup_epochs: 3
  learning_rate: 0.0016
  minimum_learning_rate: 0.00001
  weight_decay: 0.0001

loss:                               # FocalTverskyCELoss
  # alpha = 1 - beta (derived in runner). beta 0.60 -> alpha 0.40.
  # Measured on the frozen 40-case diagnostic test split, worst-10 ET cases,
  # total predicted vs ground-truth voxels:
  #   beta 0.75 -> 17.3x over-predicted (5/5 cases)
  #   beta 0.50 ->  2.6x, but 6/10 cases UNDER-predicted
  tversky_beta: 0.60
  focal_gamma: 1.33
  ce_weight: 0.5
  empty_region_bce_weight: 0.1

# INERT IN PRODUCTION: patch-level ET sampling, used only by patchify (off).
# Case-level small-lesion sampling is configured in lesion_aware_sampling below.
sampling:                           # patch-level only; INERT while patchify is OFF
  prioritize_probability: 0.7
  prioritize_region: 2              # 2 = ET (hardest region)

# Small-lesion sampling (part of the production configuration): training cases
# are weighted by ET volume so small-lesion cases (<= 100 resampled voxels) are
# drawn more often (measured share 0.113 -> 0.178 at boost 2.0). Epoch length and
# step count are unchanged; validation and test are never weighted. No Dice claim;
# set enabled: false for uniform sampling. ET counts are cached per split.
lesion_aware_sampling:
  enabled: true
  boost: 2.0                        # max relative draw rate for small-lesion cases
  small_lesion_voxels: 100          # resampled 128^3 voxels; analysis bin, not clinical
  apply_to_validation: false        # validation stays a uniform full pass
  apply_to_test: false              # test stays a uniform full pass

ema:
  enabled: true
  decay: 0.999

gradient:
  clipping_enabled: true
  max_norm: 1.0

evaluation:
  threshold: 0.5
  tune_thresholds: true             # VALIDATION ONLY — test stays frozen
  smoothing_window: 3

  # Connected-component filtering of predictions, evaluation only. ET is off
  # (a threshold of 10 erased a real scattered lesion); TC 5 clears 1-4 voxel specks.
  # Lesion-size strata reports are analysis only, in resampled 128^3 voxels.

  postprocessing:
    enabled: true
    min_component_voxels:
      WT: 50
      TC: 5
      ET: 0

logging:
  tensorboard: true
  # Recovery snapshot every 5 epochs, independent of best.pth (a Spot
  # preemption costs at most 5 epochs).
  checkpoint_frequency: 5

  # Ranked best checkpoints on the same validation metric as best.pth;
  # weights are never averaged.
  top_k_checkpoints: 3

memory:
  # Required: training runs out of memory without it (use_reentrant=False).
  gradient_checkpointing: true

performance:
  # bf16 applies to the MODEL FORWARD ONLY. The loss stays FP32 because PyTorch
  # refuses to autocast binary_cross_entropy. fp16 is explicitly REFUSED by the
  # runner with a hard error rather than silently falling back.
  precision: bf16
  # Dice/mIoU every epoch; HD95 (expensive surface distance) every 10th.
  # Model selection and final test evaluation are unaffected.
  hd95_every_epochs: 10

# =============================================================================
# GLO-NCA PRODUCTION CONFIGURATION  (the single active training config)
#
# Architecture: GLO-NCA with global context + multi-level fusion
#   level1 = global-context level, sees the whole working volume
#   level2 = high-resolution segmentation level
#   SE (channel) + spatial global context at every NCA step
#   learnable inter-level projection + learnable fusion Conv3d(48 -> 24)
#
# Parameters, verified from the constructed model rather than from docs:
#   29,337 at inference
#   29,412 during training, including 75 training-only deep-supervision
#          auxiliary parameters that are not used for inference
#
# -----------------------------------------------------------------------------
# ARCHITECTURE PROVENANCE
#
# The geometry below replaced an earlier configuration by explicit decision.
# That was a scientific change, not an engineering optimisation:
#
#                        earlier           production
#   level1 kernel        k=7               k=5
#   level2 kernel        k=3               k=5
#   NCA steps            20+20 = 40        15+15 = 30
#   spatial GC kernel    k=7               k=5
#   parameters           33,089            29,337 (inference)
#
# The spatial global-context kernel is the thesis contribution, and reducing
# it from 7 to 5 shrinks that mechanism's receptive field. The change was
# approved on speed grounds and carries no Dice/IoU/HD95 evidence: the thesis
# training run must establish that before any quality claim is made.
#
# The earlier 33,089-parameter configuration remains recoverable from git
# history; extra/reports/audit/ holds its measured evidence.
#
# -----------------------------------------------------------------------------
# PATCHIFY - RESOLVED AS OFF
#
# With training_patch enabled the dataset crops a 64^3 patch out of the 96^3
# working volume before the model is called. level1, the global-context level,
# would then cover roughly 30% of the brain during training while covering the
# whole brain at evaluation.
#
# MEASURED (RTX 3050, bf16, batch 1, matched conditions; see
# extra/reports/benchmarks/glo_nca_phase2/patchify_speed.json):
#     patchify ON  (model gets 64^3): 8200.6 ms/iter, 1406 MB peak
#     patchify OFF (model gets 96^3): 8191.0 ms/iter, 1416 MB peak
#     difference: -9.6 ms/iter (-0.1%), +10 MB
#
# Patchify buys no speed here: both settings run the same NCA grids, and those
# grids dominate cost. It only changes which anatomy the grid covers, so it
# would cost the thesis contribution and return nothing.
#
# The runner reads this flag from config and refuses to start a production run
# with patchify enabled.
# =============================================================================

experiment:
  name: GLO-NCA-PRODUCTION
  seed: 42

dataset:
  root: null                        # supplied by --data-root / cloud entrypoint
  number_of_patients: 0             # 0 = use the full canonical split
  modalities: [t1n, t1c, t2w, t2f]
  split_seed: 42

data:
  # CANONICAL SPLIT - frozen, never modified. 898 / 200 / 198.
  # SHA d30d71956ee9267017010e5ad71fc033158da818f4af53569e8a65289209559d
  split_file: split/master_split.json
  quality_policy_file: split/data_quality_policy.json

  # Deterministic preprocessing cache. Caches ONLY the deterministic head of
  # __getitem__ (load -> foreground crop -> resample -> label conversion).
  # All stochastic work (patchify, augmentation, per-(epoch,case) RNG) still
  # runs every epoch, and cache lookup is RNG-neutral.
  # Measured: 29.7x faster per case (2876.6 ms -> 96.7 ms warm), 4.75 MB/case
  # (~4.3 GB for 898 training cases). Changes NO scientific definition.
  cache:
    enabled: true                   # ENABLED: 29.7x faster preprocessing per case
    directory: .cache/preprocessed

  # See the methodology warning in the header before enabling.
  training_patch:
    enabled: false                  # patchify OFF; the runner refuses true here
    working_volume: 128             # resample target when enabled
    patch_size: 64                  # MUST be strictly < working_volume

model:
  version: v3
  name: GLO-NCA-PRODUCTION

  # ROI is an INTERNAL EFFICIENCY MECHANISM ONLY — never a methodology claim.
  # roi_fraction 1.0 == reference-identical mathematics (no cropping at all).
  # Evaluation is ALWAYS full-volume: the ROI path is structurally unreachable
  # outside training mode (`frac = self.roi_fraction if self.training else 1.0`).
  global_context:
    roi_fraction: 1.0
    global_levels: 1

  level1:                           # GLOBAL-CONTEXT level
    enabled: true
    resolution: 48
    channels: 24
    nca_steps: 15
    kernel_size: 5
  level2:                           # HIGH-RESOLUTION segmentation level
    enabled: true
    resolution: 64
    channels: 24
    nca_steps: 15
    kernel_size: 5
  level3:
    enabled: false                  # structurally NOT instantiated
    resolution: 128
    channels: 16
    nca_steps: 10

  feature_fusion:
    enabled: true
    type: concat                    # concat -> LEARNED Conv3d(48->24), not naive

  fire_rate: 0.6
  use_attention: true               # SE channel global context
  use_spatial: true                 # spatial global context
  # Receptive field of the spatial global-context block. This IS the thesis
  # contribution's kernel, so it is stated here rather than hardcoded.
  #
  # RESTORED TO 7 (was 5). An earlier change reduced this 7 -> 5 purely on
  # speed grounds, with NO Dice/IoU/HD95 evidence that the smaller receptive
  # field was as good. Since this kernel IS the contribution, it is restored to
  # the larger field by explicit decision.
  #
  # Cost, measured: the block is Conv3d(2, 1, k) applied at EVERY NCA step
  # (15 steps x 2 levels = 30 times per forward). 7^3/5^3 = 2.74x the work of
  # that conv. Isolated CPU timing put the conv itself at 505.9 ms (k=5) vs
  # 1154.7 ms (k=7) per forward, but CPU OVERSTATES a small 2->1 channel conv
  # on an L4; the GPU epoch penalty was NOT measured and is expected to be far
  # smaller. Measure it on the first production epoch rather than assuming.
  #
  # Parameter identity changes: 29,337 -> 30,209 inference (+872), so the
  # 29,337 figure in older reports refers to the k=5 configuration.
  spatial_kernel_size: 7
  hidden: 128
  dropout: 0.1

  # One 1x1 auxiliary head per non-final level, active during TRAINING only.
  # eval() returns the primary seg_head alone, so every reported metric comes
  # from the 29,337-parameter inference model.
  #   inference 29,337   training 29,412 (75 auxiliary parameters)
  deep_supervision:
    enabled: true
    weight: 0.4

training:
  # MAXIMUM training budget, not a target. Early stopping below ends the run
  # once validation has plateaued; there is no evidence that 300 epochs are
  # scientifically necessary.
  epochs: 300
  batch_size: 1                     # 2 and 4 verified working; 1 is the default

  # WORKING VOLUME. The dataset resamples each case to this size and the model
  # receives it whole; GLO_NCA_V3_MultiLevel.forward then resamples internally
  # to each level's resolution. It is therefore the global-context source, and
  # the only place the working volume is set.
  patch_size: 128
  augmentation: light
  workers: 2

  # --- overfitting protection --------------------------------------------
  # Monitors the VALIDATION split only. Training loss is deliberately not
  # monitored: a falling training loss is exactly what overfitting looks
  # like. The test split is never used for stopping or model selection.
  #
  # The monitored value is the same one used to pick the best checkpoint:
  # the 3-epoch rolling mean (evaluation.smoothing_window) of validation mean
  # foreground Dice, averaged over WT/TC/ET. Smoothing prevents one lucky
  # epoch from being selected.
  #
  # Stopping never overwrites the best checkpoint; evaluation always loads
  # the best, never the final, weights.
  early_stopping:
    enabled: true
    monitor: validation mean foreground Dice
    mode: max                       # higher Dice is better
    patience: 15                    # consecutive non-improving validations
    # A gain smaller than the validation measurement error is not evidence of
    # improvement. With 200 validation cases and a per-case Dice spread around
    # 0.20, one standard error is ~0.014, so 0.001 sat an order of magnitude
    # BELOW the noise floor and would have reset patience on chance alone.
    min_delta: 0.01

optimizer:
  # Linear warmup before the cosine schedule. 3 epochs of the 300-epoch budget.
  # PRESERVED: peak LR 0.0016 (reached at the end of warmup), minimum LR
  # 0.00001, and the total optimiser-step count. Only the shape of the first
  # 3 epochs changes; the cosine tail is re-parameterised over the remaining
  # steps so it still anneals to the minimum at the final step.
  # Rationale is STABILITY, not a quality claim: no Dice improvement is
  # claimed for warmup and none has been measured.
  warmup_epochs: 3
  learning_rate: 0.0016
  minimum_learning_rate: 0.00001
  weight_decay: 0.0001

loss:                               # FocalTverskyCELoss
  # alpha = 1 - beta (derived in runner). beta 0.60 -> alpha 0.40.
  # Measured on the frozen 40-case diagnostic test split, worst-10 ET cases,
  # total predicted vs ground-truth voxels:
  #   beta 0.75 -> 17.3x over-predicted (5/5 cases)
  #   beta 0.50 ->  2.6x, but 6/10 cases UNDER-predicted
  tversky_beta: 0.60
  focal_gamma: 1.33
  ce_weight: 0.5
  empty_region_bce_weight: 0.1

# INERT IN PRODUCTION -- READ BEFORE CITING THIS BLOCK.
#
# These keys are consumed ONLY by `patchify_multimodal` in
# src/datasets/Nii_Gz_Dataset_3D.py, inside a branch gated on
# `patchify is True and self.state == "train"`. Patchify is OFF in production
# (data.training_patch.enabled: false) and the runner refuses to start with it
# enabled, so this block is UNREACHABLE on the production training path.
#
# The production sampler is `_EpochSampler` (src/experiment/runner.py): a
# deterministic per-epoch shuffle. The production baseline is therefore
# UNIFORM CASE-LEVEL SAMPLING, with no ET prioritisation of any kind.
#
# The keys are retained rather than deleted so that enabling patchify keeps its
# historical behaviour, and annotated so the thesis does not claim an ET-aware
# sampling mechanism that does not run.
#
# Case reweighting is done by the SMALL-LESION-aware sampler configured in
# `lesion_aware_sampling` below, which IS part of this production baseline.
# It is not
# "ET-positive oversampling": every measured BraTS-METS training case contains
# enhancing tumour, so ET presence carries no signal; ET VOLUME does.
sampling:                           # patch-level only; INERT while patchify is OFF
  prioritize_probability: 0.7
  prioritize_region: 2              # 2 = ET (hardest region)

# SMALL-LESION-AWARE CASE SAMPLING -- part of the baseline by explicit decision.
#
# WHAT IT DOES: weights training cases by ET VOLUME so that SMALL-lesion cases
# are drawn more often. It is NOT "ET-positive oversampling": every measured
# BraTS-METS training case contains enhancing tumour (300/300 measured), so ET
# presence carries no signal on this cohort -- ET VOLUME does, spanning roughly
# three orders of magnitude (15 -> 45,406 resampled voxels).
#
# MEASURED on the census (30 epochs, seed 42, boost 2.0):
#   small-ET (<= 100 resampled voxels) share  0.1133 -> 0.1780  (~1.57x)
#   ET-positive share                         1.0000 -> 1.0000  (no headroom)
#   epoch length                              UNCHANGED
#
# Epoch length is deliberately unchanged (len(dataset) draws, with
# replacement), so the optimiser-step count and the cosine schedule are
# identical to uniform sampling.
#
# NO DICE CLAIM. This has not been A/B tested against uniform sampling; the
# uniform baseline remains available at configs/experiments/ for that
# comparison if it is ever required. Validation and test are NEVER weighted.
#
# Cost: 1.31 ms sampler construction + 0.84 ms/epoch draw, plus a one-off ET
# voxel count over the training split (cached in the workspace by split
# fingerprint, so a resume does not repeat it).
lesion_aware_sampling:
  enabled: true
  boost: 2.0                        # max relative draw rate for small-lesion cases
  small_lesion_voxels: 100          # resampled 128^3 voxels; analysis bin, not clinical
  apply_to_validation: false        # validation stays a uniform full pass
  apply_to_test: false              # test stays a uniform full pass

ema:
  enabled: true
  decay: 0.999

gradient:
  clipping_enabled: true
  max_norm: 1.0

evaluation:
  threshold: 0.5
  tune_thresholds: true             # VALIDATION ONLY — test stays frozen
  smoothing_window: 3

  # Connected-component filtering applied to PREDICTIONS at evaluation only.
  # Never touches training targets, loss or backpropagation.
  # Measured on the frozen diagnostic split: an ET threshold of 10 reduced a
  # real 246-voxel scattered lesion to 1 voxel, so ET is disabled; TC 5 clears
  # 1-4 voxel specks while preserving the larger connected body.
  # Lesion-size stratified reporting (ANALYSIS ONLY). Groups the existing
  # per-case rows by ground-truth lesion size and re-reports the SAME metrics
  # per stratum; it adds no model passes and cannot affect training, threshold
  # tuning, checkpoint selection or early stopping. Sizes are counted in
  # RESAMPLED voxels of the 128^3 grid (per-case scale factor, no spacing is
  # carried through the pipeline), so the bins are ANALYSIS bins, NOT clinical
  # categories. Outputs reports/{validation,test}_by_lesion_size.csv.

  postprocessing:
    enabled: true
    min_component_voxels:
      WT: 50
      TC: 5
      ET: 0

logging:
  tensorboard: true
  # Periodic recovery snapshot, kept INDEPENDENTLY of the best checkpoint.
  # 5 (not 10) so a preemption on a Spot/preemptible VM costs at most five
  # epochs of work. A checkpoint is 0.546 MB and the write was measured at
  # ~0.01 s, so the extra frequency is free.
  checkpoint_frequency: 5

  # Ranked best checkpoints (best_1 .. best_k) under checkpoints/top_k/,
  # selected on the SAME validation metric as best.pth, so best_1 and
  # best.pth always agree. Weights are NEVER averaged and no SWA is
  # performed: the ranked files are for inspection and for a later,
  # explicitly approved experiment. 1 = single best only (previous
  # behaviour).
  top_k_checkpoints: 3

memory:
  # LOAD-BEARING, not an optimization: training OOMs without it. Calls `update`
  # twice per step (forward + backward recompute), use_reentrant=False.
  gradient_checkpointing: true

performance:
  # bf16 applies to the MODEL FORWARD ONLY. The loss stays FP32 because PyTorch
  # refuses to autocast binary_cross_entropy. fp16 is explicitly REFUSED by the
  # runner with a hard error rather than silently falling back.
  precision: bf16
  # Dice/mIoU every epoch; HD95 (expensive surface distance) every 10th.
  # Model selection and final test evaluation are unaffected.
  hd95_every_epochs: 10
